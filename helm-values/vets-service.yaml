# vets-service.yaml — Vets Service (PETPLAT-44)
#
# Merged as: helm/petclinic-service/values.yaml → this file → helm-values/{env}.yaml
#
# The one service whose profile list is not just docker,mysql — see the comment
# on springProfiles below. Getting this wrong does not break startup, which is
# what makes it worth the paragraph.

fullnameOverride: vets-service
component: service
image:
  name: vets-service
  tag: "964e645"
service:
  port: 8083
# THREE profiles, and `production` is not decoration.
#
# The application repo's vets-service/src/main/resources/application.yml sets
# `spring.profiles.active: production`, and SPRING_PROFILES_ACTIVE overrides it
# rather than adding to it — so setting only `docker,mysql` here would switch
# `production` OFF. That matters because
# spring-petclinic-vets-service/.../vets/system/CacheConfig.java is annotated
# @Profile("production"), and it is the only @Profile in the whole application:
# without it the Caffeine cache bean is never registered and every /vets request
# goes to the database. The service still starts and still answers correctly,
# which is exactly why this would go unnoticed until RDS load did.
springProfiles: docker,mysql,production
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
secrets:
  - name: SPRING_DATASOURCE_USERNAME
    secretName: rds-credentials
    key: username
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: rds-credentials
    key: password
configMap:
  data:
    CONFIG_SERVER_URL: http://config-server:8888
    SPRING_DATASOURCE_URL: "{{ .Values.database.connectionString }}"

    # Tracing — same two variables, and the same caveat, as api-gateway.yaml,
    # where the reasoning is written out in full. In short:
    #
    #  * MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT, not the spec's
    #    MANAGEMENT_ZIPKIN_TRACING_ENDPOINT. The spec's name binds to
    #    `management.zipkin.tracing.endpoint`, which Spring Boot removed in 3.2 —
    #    in spring-boot-zipkin-4.1.1 it survives only as a hand-written metadata
    #    entry with `type=None`, so nothing binds it and setting it does nothing
    #    at all.
    #  * http://zipkin.tracing:9411/api/v2/spans, because the config repo's
    #    `tracing-server` name is a docker-compose container name that resolves
    #    only inside one namespace. This Service is `zipkin` in `tracing`.
    #  * 1.0, because the default 0.1 samples one request in ten and makes a
    #    working setup look broken.
    MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin.tracing:9411/api/v2/spans
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
