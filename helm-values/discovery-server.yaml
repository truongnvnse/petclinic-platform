# discovery-server.yaml — Discovery Server / Eureka (PETPLAT-40)
#
# Merged as: helm/petclinic-service/values.yaml → this file → helm-values/{env}.yaml
#
# Second in the chain. It reads its own configuration from the Config Server
# (spring.config.import in the application repo's application.yml), so it waits
# for config-server — but nothing waits on it yet, so it does not wait for
# itself.

fullnameOverride: discovery-server

component: server

image:
  name: discovery-server
  tag: "v1.0.0"

service:
  port: 8761

springProfiles: docker

initContainers:
  # The `docker` profile's import is `configserver:http://config-server:8888`
  # with no `optional:` prefix, so a discovery-server that starts first does not
  # fall back to defaults — it exits. wget returns non-zero on a connection
  # refusal and on the 503 Spring returns while the health indicator is DOWN, so
  # a successful wget means the Config Server is actually serving.
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']

configMap:
  data:
    # Only consumed by the default profile, where the import falls back to
    # ${CONFIG_SERVER_URL:http://localhost:8888/}. Under `docker` the URL is
    # hardcoded to the same host in the application repo's application.yml, so
    # this is belt-and-braces rather than the thing that makes it work.
    CONFIG_SERVER_URL: http://config-server:8888

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Two replicas, set here rather than in helm-values/prod.yaml — see the note
# there. Prod figure from the spec's overlay table ("2 | HA for service
# registry"); dev.yaml collapses it back to 1.
#
# Two Eureka peers that do not know about each other do not replicate their
# registries, so this is redundancy for availability rather than for consistency:
# a client that reaches either peer sees a working registry, but the two
# registries drift. Pointing them at each other (eureka.client.serviceUrl
# .defaultZone listing both) is what would make them a proper cluster, and that
# is not configured — the config repo sets a single defaultZone. Worth knowing
# before treating "2 replicas of discovery-server" as high availability.
replicaCount: 2

# No HPA — not in the spec's HPA table. Eureka is a registry, and its load is a
# function of how many clients exist, not of traffic.
autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1
