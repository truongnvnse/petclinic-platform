# visits-service.yaml — Visits Service (PETPLAT-42)
#
# Merged as: helm/petclinic-service/values.yaml → this file → helm-values/{env}.yaml
#
# The third RDS-backed service and the one that proves the database wiring end
# to end: `visits` has foreign keys into both `owners` and `vets`, so a row here
# can only exist if customers-service and vets-service are reachable and
# pointing at the same instance.

fullnameOverride: visits-service
component: service
image:
  name: visits-service
  tag: "b1e35a0"
service:
  port: 8082
springProfiles: docker,mysql
initContainers:
  # Waits on config-server and discovery-server, not on customers-service or
  # vets-service. It does not need them to start — Spring Data JPA resolves
  # foreign keys inside the database, not over HTTP. It does need the schema,
  # which Hibernate creates on first connect.
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
secrets:
  - name: SPRING_DATASOURCE_USERNAME
    secretName: rds-credentials
    key: username
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: rds-credentials
    key: password
configMap:
  data:
    CONFIG_SERVER_URL: http://config-server:8888
    # Same as customers-service: the `mysql` profile would otherwise point this
    # at localhost:3306, and spring.cloud.config.override-none=true in the
    # config repo is what makes this environment variable win over it.
    SPRING_DATASOURCE_URL: "{{ .Values.database.connectionString }}"

    # Tracing — same two variables, and the same caveat, as api-gateway.yaml,
    # where the reasoning is written out in full. In short:
    #
    #  * MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT, not the spec's
    #    MANAGEMENT_ZIPKIN_TRACING_ENDPOINT. The spec's name binds to
    #    `management.zipkin.tracing.endpoint`, which Spring Boot removed in 3.2 —
    #    in spring-boot-zipkin-4.1.1 it survives only as a hand-written metadata
    #    entry with `type=None`, so nothing binds it and setting it does nothing
    #    at all.
    #  * http://zipkin.tracing:9411/api/v2/spans, because the config repo's
    #    `tracing-server` name is a docker-compose container name that resolves
    #    only inside one namespace. This Service is `zipkin` in `tracing`.
    #  * 1.0, because the default 0.1 samples one request in ten and makes a
    #    working setup look broken.
    MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin.tracing:9411/api/v2/spans
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
