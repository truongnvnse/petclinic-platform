# genai-service.yaml — GenAI Service (PETPLAT-44)
#
# Merged as: helm/petclinic-service/values.yaml → this file → helm-values/{env}.yaml
#
# The only service with an external dependency that is neither in the cluster
# nor in AWS: it calls OpenAI. It is also the only WebFlux service
# (spring.main.web-application-type: reactive) and the only one whose replicas
# the spec pins at 1 in prod — see helm-values/prod.yaml.

fullnameOverride: genai-service
component: service
image:
  name: genai-service
  tag: "48d7745"
service:
  port: 8084
# No `mysql`. The spec's service table marks this one "Needs MySQL: Optional",
# and nothing actually asks for it: neither the application repo's
# application.yml nor the config repo's genai-service.yml declares a datasource
# or a mysql profile. Adding it here would only make the service wait on a
# database it never opens.
#
# No `production` either, unlike vets-service. genai-service's application.yml
# does declare `spring.profiles.active: production`, but nothing is gated on it:
# there is no `on-profile: production` block in either the application or the
# config repo, and no @Profile("production") anywhere in this module. So
# overriding it with `docker` changes nothing.
springProfiles: docker
initContainers:
  # Both waits, even though genai-service is the one service that would survive
  # without them: its default-profile import is
  # `optional:configserver:${CONFIG_SERVER_URL:...}`. The `docker` profile
  # replaces that import with a NON-optional `configserver:http://config-server:8888`,
  # which is the profile this deployment activates — so the import fails hard
  # and the wait is real.
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
secrets:
  # application.yml reads ${OPENAI_API_KEY:demo} — note the default. Without this
  # Secret the service starts happily and answers every prompt with whatever the
  # "demo" key gets back, which is an error the app reports as a downstream
  # failure rather than a missing configuration. The Secret comes from the
  # ExternalSecret in k8s/base/external-secrets/openai-api-key.yaml, backed by
  # petclinic/{env}/openai-api-key in Secrets Manager.
  - name: OPENAI_API_KEY
    secretName: openai-api-key
    key: OPENAI_API_KEY
configMap:
  data:
    CONFIG_SERVER_URL: http://config-server:8888
    # AZURE_OPENAI_KEY and AZURE_OPENAI_ENDPOINT are deliberately NOT set.
    # application.yml interpolates both without a default, which would fail
    # startup if anything bound them — but the Azure starter is commented out in
    # the module's pom.xml, so the spring.ai.azure.* block is never bound and the
    # placeholders are never resolved.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
# HPA on, but the floor is 1: the spec's HPA table gives this service 1–3, and
# the ceiling is low because the work it scales on is a network round-trip to
# OpenAI, not local CPU. More replicas do not make OpenAI answer faster.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
# No PDB — the spec's PDB table lists six services and this is not one of them.
# It is also the one service with no in-cluster dependents: nothing routes to it
# except api-gateway, and a brief gap degrades to an error page rather than to
# lost data.
podDisruptionBudget:
  enabled: false
