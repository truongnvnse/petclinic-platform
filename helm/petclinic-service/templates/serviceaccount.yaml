{{/*
serviceaccount.yaml — one ServiceAccount per service (PETPLAT-39, PETPLAT-43, …)

Every workload gets its own account rather than sharing `default`. The practical
reason is that `default` is the identity anything without an explicit account
falls back to, so a pod that mounts `default` cannot be told apart from a pod
that forgot to say which identity it wanted. The other reason is that an IRSA
annotation, if one is ever needed, is per-account — putting it on `default`
would hand those AWS permissions to every pod in the namespace.

None of the eight services needs one today: they read the Secrets that External
Secrets Operator writes, and never call the AWS API themselves. That is why
serviceAccount.annotations is empty in every values file, and why the empty case
is the documented default rather than an oversight.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "petclinic-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}

  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
