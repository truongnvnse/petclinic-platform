# alerting-rules.yaml — every alert rule in the platform, metric and log
#
# PETPLAT-58. Five Prometheus rules and two Loki rules, all of them routed
# through the one Alertmanager in alertmanager.yaml.
#
# Expressions, `for` durations and severity labels are copied from
# docs/technical-spec.md → "Observability" → "Alert Rules (Prometheus)" and
# "Loki Alert Rules" and are not paraphrased. Two of the five metric rules
# depend on metrics that come from somewhere other than the application
# services, and those two sources are wired up in prometheus.yaml — see the
# note on each.
#
# ---------------------------------------------------------------------------
# The same five rules appear twice in this file, and that is deliberate
#
#   * ConfigMap `prometheus-rules` — what actually loads. Prometheus mounts it
#     at /etc/prometheus/rules and reads it through the `rule_files` glob in
#     prometheus.yaml. This is a plain Prometheus Deployment, so a file on disk
#     is the only thing it can evaluate.
#
#   * PrometheusRule `petclinic-alerts` — the Kubernetes-native form of the same
#     rules, which PETPLAT-58 asks for. It is inert today: a PrometheusRule is
#     read by the Prometheus Operator, and no operator is installed. It is kept
#     because installing one later makes it live with no rewrite, and because
#     `kubectl get prometheusrules -n monitoring` is the readable form of the
#     alert set.
#
# The cost of having both is real and worth stating plainly: editing one and not
# the other leaves the two disagreeing, and the ConfigMap is the one that wins.
# If that becomes a problem the fix is to pick one — either install the operator
# and delete the ConfigMap, or delete the PrometheusRule and accept that the
# rules live only in a ConfigMap.
# ---------------------------------------------------------------------------

# ===========================================================================
# The metric rules, in the form Prometheus evaluates
# ===========================================================================
apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-rules
  namespace: monitoring

  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

data:
  # The `.rules.yaml` suffix is what the `rule_files` glob in prometheus.yaml
  # matches. A key without it would mount fine and be silently ignored.
  petclinic.rules.yaml: |
    groups:
      - name: petclinic-services

        rules:
          # -------------------------------------------------------------
          # ServiceDown — the only rule that needs no application metric.
          #
          # `up` is generated by Prometheus itself for every target, so this
          # fires for a target that has stopped answering, which is exactly the
          # case where the application's own metrics are unavailable. It is
          # also why the five-service scrape list matters: a target for a
          # service with no Prometheus registry is a target that is always 0.
          # -------------------------------------------------------------
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Target {{ $labels.job }} has been down for more than 1 minute"
              description: >-
                Prometheus has failed to scrape {{ $labels.instance }} in the
                {{ $labels.namespace }} namespace for over a minute.

          # -------------------------------------------------------------
          # HighErrorRate — 5xx as a share of all requests, over 5 minutes.
          #
          # http_server_requests_seconds_count comes from the five services'
          # own Prometheus registries, so this is per-service as written: one
          # series per job, and each is judged on its own ratio.
          # -------------------------------------------------------------
          - alert: HighErrorRate
            expr: >-
              rate(http_server_requests_seconds_count{status=~"5.."}[5m])
              / rate(http_server_requests_seconds_count[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.job }} is serving more than 5% 5xx responses"
              description: >-
                More than one request in twenty has failed with a 5xx status
                for five minutes.

          # -------------------------------------------------------------
          # HighLatency — p95 above half a second, over 5 minutes.
          #
          # No `job` or `uri` filter, so this is the p95 across every service
          # and every endpoint pooled together: one busy endpoint can hold the
          # whole aggregate above the threshold on its own. That is the spec's
          # expression, kept as written.
          # -------------------------------------------------------------
          - alert: HighLatency
            expr: >-
              histogram_quantile(0.95,
              rate(http_server_requests_seconds_bucket[5m])) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "p95 latency above 500ms for {{ $labels.job }}"
              description: >-
                95% of requests are completing in under 500ms no longer — the
                p95 has been above that for five minutes.

          # -------------------------------------------------------------
          # PodRestartLoop — a container restarting repeatedly.
          #
          # kube_pod_container_status_restarts_total is a kube-state-metrics
          # metric. Nothing in the application exposes it, which is why
          # kube-state-metrics.yaml exists and why prometheus.yaml scrapes it.
          # Without that workload this rule evaluates against an empty vector
          # and never fires.
          #
          # `for: 0m` means fire on the first evaluation that matches — no
          # sustained-condition window, because four restarts in fifteen
          # minutes is already the sustained condition.
          # -------------------------------------------------------------
          - alert: PodRestartLoop
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.pod }} is restarting repeatedly"
              description: >-
                Container {{ $labels.container }} in pod {{ $labels.pod }} has
                restarted more than three times in fifteen minutes.

          # -------------------------------------------------------------
          # HighMemoryUsage — working set above 80% of the container limit.
          #
          # Both metrics are cAdvisor's, served by the kubelet and collected by
          # the `kubernetes-nodes-cadvisor` job in prometheus.yaml. A container
          # with no memory limit has no container_spec_memory_limit_bytes, so it
          # produces no ratio and is skipped rather than alerted on — the reason
          # every container in this stack sets a limit.
          #
          # Unfiltered by namespace or container, so it covers system pods as
          # well as petclinic ones. That is the spec's expression.
          # -------------------------------------------------------------
          - alert: HighMemoryUsage
            expr: >-
              container_memory_working_set_bytes
              / container_spec_memory_limit_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.container }} is above 80% of its memory limit"
              description: >-
                Container {{ $labels.container }} in pod {{ $labels.pod }} has
                held more than 80% of its memory limit for five minutes.

---
# ===========================================================================
# The same five rules in the Prometheus Operator's form
#
# monitoring.coreos.com/v1 — the CRD must exist before this applies. It is not
# part of a standard cluster:
#
#   kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml
#
# Without it `kubectl apply --dry-run=client` fails with "no matches for kind
# PrometheusRule", even in dry-run mode: the client still has to resolve the
# kind against the API server's discovery data.
# ===========================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: petclinic-alerts
  namespace: monitoring

  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

    # What the Prometheus Operator selects on when it decides which rules to
    # load. A rule object without the operator's selector label is installed and
    # then ignored, which looks exactly like a rule that is not firing.
    # `release: prometheus` matches the convention used by the kube-prometheus
    # stack's Helm chart.
    release: prometheus

spec:
  groups:
    - name: petclinic-services

      rules:
        - alert: ServiceDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Target {{ $labels.job }} has been down for more than 1 minute"
            description: >-
              Prometheus has failed to scrape {{ $labels.instance }} in the
              {{ $labels.namespace }} namespace for over a minute.

        - alert: HighErrorRate
          expr: >-
            rate(http_server_requests_seconds_count{status=~"5.."}[5m])
            / rate(http_server_requests_seconds_count[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} is serving more than 5% 5xx responses"
            description: >-
              More than one request in twenty has failed with a 5xx status
              for five minutes.

        - alert: HighLatency
          expr: >-
            histogram_quantile(0.95,
            rate(http_server_requests_seconds_bucket[5m])) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "p95 latency above 500ms for {{ $labels.job }}"
            description: >-
              95% of requests are completing in under 500ms no longer — the
              p95 has been above that for five minutes.

        - alert: PodRestartLoop
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pod }} is restarting repeatedly"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }} has
              restarted more than three times in fifteen minutes.

        - alert: HighMemoryUsage
          expr: >-
            container_memory_working_set_bytes
            / container_spec_memory_limit_bytes > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.container }} is above 80% of its memory limit"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }} has
              held more than 80% of its memory limit for five minutes.

---
# ===========================================================================
# The Loki rules — a different evaluator, the same Alertmanager
#
# Loki's ruler reads rule files from a directory, exactly as Prometheus does,
# and evaluates LogQL against the log stream rather than PromQL against the
# metric store. It is not a PrometheusRule and no CRD describes it: this is a
# plain ConfigMap that loki.yaml mounts.
#
# ---------------------------------------------------------------------------
# Why the file is mounted at .../rules/fake/rules.yaml
#
# Loki's ruler is multi-tenant even when it is not. With `auth_enabled: false`
# — which is how loki.yaml is configured, there being no gateway in front of it
# — every request is assigned the single tenant `fake`. The ruler looks for
# rules at `<rules_directory>/<tenant>/rules.yaml`, so the path has to carry a
# directory literally named `fake` or the ruler finds no rule files at all. It
# logs one error per sync interval and evaluates nothing; there is no other
# symptom.
#
# The directory name is not configurable in the way it looks: `rule_path` in
# loki.yaml is a scratch directory for the ruler's own working files, not the
# place rules are read from. Confusing the two is the usual way this ends up
# silently empty.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap

metadata:
  name: loki-rules
  namespace: monitoring

  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

data:
  rules.yaml: |
    groups:
      - name: petclinic-logs

        rules:
          # -------------------------------------------------------------
          # LogErrorSpike — ERROR lines arriving faster than one every two
          # seconds, sustained for five minutes.
          #
          # The selector matches both application namespaces, so a spike in dev
          # and a spike in prod are separate streams and alert separately.
          #
          # `|=` is a substring filter, not a regex, and it is what makes this
          # cheap: Loki can discard non-matching lines without parsing them.
          # The cost is that it also matches a line that merely mentions the
          # word — a log line quoting an exception message, for instance.
          # -------------------------------------------------------------
          - alert: LogErrorSpike
            expr: rate({namespace=~"petclinic-.*"} |= "ERROR" [5m]) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "ERROR log rate is elevated in {{ $labels.namespace }}"
              description: >-
                More than 0.5 ERROR lines per second for five minutes from
                {{ $labels.pod }} in {{ $labels.namespace }}.

          # -------------------------------------------------------------
          # JVMOutOfMemory — a single OutOfMemoryError in five minutes.
          #
          # `for: 0m`: one occurrence is the whole signal. A JVM that has
          # thrown OutOfMemoryError is already in a state it will not recover
          # from on its own, and waiting for a second one just delays the page.
          # -------------------------------------------------------------
          - alert: JVMOutOfMemory
            expr: count_over_time({namespace=~"petclinic-.*"} |= "OutOfMemoryError" [5m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "OutOfMemoryError in {{ $labels.pod }}"
              description: >-
                The JVM in {{ $labels.pod }} ({{ $labels.namespace }}) has
                thrown OutOfMemoryError in the last five minutes. A restart
                clears the symptom and not the cause — check the container's
                memory limit against its working set before scaling it up.
