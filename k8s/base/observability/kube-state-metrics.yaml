# kube-state-metrics.yaml — the cluster-state exporter PodRestartLoop needs
#
# Not one of the seven files PETPLAT-55…PETPLAT-60 names. It is here because the
# spec's alert table names a metric nothing in the platform produces:
#
#     PodRestartLoop | increase(kube_pod_container_status_restarts_total[15m]) > 3
#
# kube_pod_container_status_restarts_total is a kube-state-metrics metric. No
# application exposes it, the kubelet does not serve it, and Prometheus does not
# synthesise it. Without this workload that rule loads, evaluates against an
# empty vector, and never fires — which is indistinguishable from a rule that is
# working and simply has nothing to report. prometheus.yaml carries a scrape job
# pointing at this Service for the same reason.
#
# The other two of the five spec rules are covered without a new workload:
# `up` is Prometheus's own, http_server_requests_* comes from the five services,
# and the cAdvisor metrics behind HighMemoryUsage are served by the kubelet and
# scraped by the `kubernetes-nodes-cadvisor` job.
#
# ---------------------------------------------------------------------------
# Two grants from the upstream role are deliberately absent
#
# Upstream's ClusterRole is wider than this deployment needs. Both omissions are
# choices, not oversights, and both are cheap to reverse:
#
#   * **secrets** — upstream grants `list`/`watch` on Secrets cluster-wide. KSM
#     reads every object it can see, so that grant is the whole cluster's
#     credentials to anything that compromises this pod, and none of the five
#     alert rules uses a secret metric. The `--resources` list below excludes
#     `secrets` to match, so KSM never tries to watch what it cannot read —
#     leaving the grant in place while excluding the resource would work too,
#     but a role that grants more than the workload uses is how permissions
#     drift upward. Re-add both together if secret metrics are ever wanted.
#
#   * **tokenreviews / subjectaccessreviews** — these exist for KSM's
#     `--auth-filter`, which authenticates and authorizes each scrape against
#     the API server. It is off here: Prometheus is the only scraper, it is a
#     ClusterIP inside the cluster, and there is no Ingress in front of it.
#     Enabling `--auth-filter` without these grants makes every scrape fail with
#     "auth filter unavailable", so add them at the same time.
#
# What is NOT dropped: nothing else in the upstream role is sensitive. The rest
# is read-only list/watch on objects the cluster already exposes to anything
# that can reach the API server.
#
# ---------------------------------------------------------------------------
# --resources is a curated subset, and it must stay in step with the ClusterRole
#
# The list is copied verbatim from KSM's own `--resources` default (printed by
# `--help`), minus the resources above and minus the admission-policy and
# webhook types this cluster does not use. Every name in it is granted by the
# ClusterRole below — a resource that is enabled but not granted produces a
# stream of Forbidden errors in the log and no metrics, and a resource that is
# granted but not enabled is dead permission.
#
# Dropped from the default: secrets, configmaps, certificatesigningrequests,
# replicationcontrollers, volumeattachments, and the mutating/validating
# admission policy and webhook types.
# ---------------------------------------------------------------------------

# ===========================================================================
# RBAC — read-only, and only on the objects whose metrics are enabled
# ===========================================================================
apiVersion: v1
kind: ServiceAccount

metadata:
  name: kube-state-metrics
  namespace: monitoring

  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: kube-state-metrics

  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

rules:
  # One entry per API group, and the resources in each entry are exactly the
  # ones the --resources flag enables. KSM only ever lists and watches: it reads
  # cluster state to turn it into metrics and never writes anything back.
  - apiGroups: [""]
    resources:
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - resourcequotas
      - services
    verbs: ["list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["list", "watch"]

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch"]

  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["list", "watch"]

  # EndpointSlices live in their own group, not in the core group alongside
  # `endpoints`. Getting this wrong is a silent Forbidden.
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["list", "watch"]

  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: kube-state-metrics

  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics

subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring

---
# ===========================================================================
# The exporter
# ===========================================================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: kube-state-metrics
  namespace: monitoring

  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

spec:
  # One. It holds no state — every metric is a read of the API server's current
  # objects — but two replicas would double every series in Prometheus and make
  # any `sum()` over them wrong. That is the same reason it is not a DaemonSet.
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/component: observability

    spec:
      serviceAccountName: kube-state-metrics

      securityContext:
        # The image's own user is `nobody` (uid 65534), which is what the
        # distroless base sets. Pinned rather than inherited so a new tag cannot
        # change it silently.
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534

      containers:
        - name: kube-state-metrics

          # Pinned, and multi-arch: linux/arm64 is published, which the Graviton
          # nodes need.
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0

          # The image's entrypoint is already
          #   /kube-state-metrics --port=8080 --telemetry-port=8081
          # and `args` is appended to it, so those two are not repeated here.
          args:
            - --resources=cronjobs,daemonsets,deployments,endpointslices,horizontalpodautoscalers,ingresses,jobs,leases,limitranges,namespaces,networkpolicies,nodes,persistentvolumeclaims,persistentvolumes,poddisruptionbudgets,pods,replicasets,resourcequotas,services,statefulsets,storageclasses

          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP

            - name: telemetry
              containerPort: 8081
              protocol: TCP

          # -----------------------------------------------------------------
          # The two probes are deliberately different, and the names are the
          # opposite way round from what they suggest.
          #
          # /livez does not check this process. It proxies the API server's own
          # /livez through KSM's credentials and mirrors the answer, so it fails
          # whenever the API server is unreachable. That makes it the right
          # READINESS signal — a KSM that cannot reach the API server has no
          # metrics to serve, and Prometheus should not scrape it — and the
          # wrong LIVENESS signal, because restarting this pod does not fix an
          # API server outage, it just turns one into a restart loop.
          #
          # /healthz is a handler that always returns 200. It is a weak liveness
          # probe and is used as one on purpose: the only thing it can catch is
          # a wedged process, and it can never restart the pod during a blip it
          # could not have caused.
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            # Memory tracks the number of objects in the cluster, not traffic:
            # KSM holds an informer cache of everything in --resources. Small
            # here because this cluster has two nodes and a handful of pods.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi

---
# ===========================================================================
# Service
#
# The port NAME is load-bearing. The `kube-state-metrics` scrape job in
# prometheus.yaml keeps targets on
# `__meta_kubernetes_endpoint_port_name: http-metrics`, so renaming this port
# silently empties the job — Prometheus would discover the Endpoints object,
# find no port with that name, and scrape nothing, with no error in either log.
#
# The `telemetry` port is not exposed on the Service. KSM's self-metrics
# (kube_state_metrics_*) would be scraped from there, and nothing in the five
# alert rules uses them; adding them would add series for no query.
# ===========================================================================
apiVersion: v1
kind: Service

metadata:
  name: kube-state-metrics
  namespace: monitoring

  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: kube-state-metrics

  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      protocol: TCP
