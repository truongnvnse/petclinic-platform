# rds-credentials.yaml — sync the RDS master credentials into the cluster (PETPLAT-35)
#
# Reads petclinic/dev/rds-credentials out of AWS Secrets Manager and writes a
# Kubernetes Secret named rds-credentials in petclinic-dev. The three
# database-backed services — customers-service, visits-service, vets-service —
# consume it through their Helm values; nothing in this repository ever holds
# the password itself.
#
# Values from docs/technical-spec.md → "Secrets Management" →
# "ExternalSecret Manifests" → RDS Credentials:
#   refreshInterval 1h, target.name rds-credentials, keys username and password
#   extracted from the JSON via remoteRef.property.
#
# ---------------------------------------------------------------------------
# The remote secret is one JSON object, the Kubernetes Secret is two keys
#
# petclinic/{env}/rds-credentials holds {"username": "...", "password": "..."},
# written as a JSON object by the rds module (PETPLAT-23). This manifest is what
# turns that single JSON document into the two flat keys a Spring Boot
# datasource expects — SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
# are filled from secretKeyRef on `username` and `password`.
#
# That is why both entries carry a remoteRef.property. Without it ESO would copy
# the whole JSON blob into each key and the datasource would receive the literal
# string {"username":"...","password":"..."} as its username. The failure is a
# connection refused with a nonsense username in the log, several layers away
# from this file.
#
# Both entries name the same remote secret; that is expected, not a mistake.
# remoteRef.key selects the secret and remoteRef.property selects the field
# within it.
#
# ---------------------------------------------------------------------------
# Ordering
#
# This ExternalSecret can be applied before the RDS secret exists — it will sit
# in SecretSynced=False with a ResourceNotFoundException until the rds module
# has been applied. That is recoverable and self-healing: the 1h refresh retries,
# and so does any reconcile the operator performs. It is not a reason to
# sequence the apply.
#
# The K8s Secret it produces is what the application Deployments reference, so
# those Deployments must not be applied before the sync succeeds — otherwise the
# pods stay in CreateContainerConfigError waiting for a Secret that is not there
# yet. Check with:
#
#   kubectl get externalsecret rds-credentials -n petclinic-dev
#   kubectl get secret rds-credentials -n petclinic-dev
#
# ---------------------------------------------------------------------------
# Namespace
#
# This file is dev-specific, following the same pattern as
# k8s/base/ingress/ingress.yaml: an ExternalSecret is namespaced and writes its
# Secret into that namespace, and the two environments have separate namespaces
# *and* separate remote secrets (petclinic/dev/... vs petclinic/prod/...). Prod
# needs its own copy in petclinic-prod pointing at petclinic/prod/rds-credentials;
# it is not parameterised here because the base layer has no templating — the
# Helm chart in helm/petclinic-service/ is where the environment split lands.
#
# A copy applied to the wrong namespace would not fail loudly. It would sync
# petclinic/dev/rds-credentials into petclinic-prod, and the prod services would
# start against the dev database with credentials that work. Read the remoteRef
# key before copying this file.

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: rds-credentials
  namespace: petclinic-dev

  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure

spec:
  # The store is cluster-scoped, so `kind` has to be stated — the default for
  # secretStoreRef is SecretStore, which would look for a namespaced store
  # called aws-secrets-manager in petclinic-dev and not find one.
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  refreshInterval: 1h

  target:
    # creationPolicy and deletionPolicy are left at their defaults (Owner and
    # Retain). Owner means the K8s Secret is owned by this ExternalSecret and is
    # garbage-collected with it, which is what makes deleting this file a
    # complete removal rather than a leak.
    name: rds-credentials

  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: username

    - secretKey: password
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: password
