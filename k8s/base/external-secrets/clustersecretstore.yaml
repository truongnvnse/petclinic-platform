# clustersecretstore.yaml — the AWS Secrets Manager store (PETPLAT-34)
#
# The connection between ESO and AWS Secrets Manager. Every ExternalSecret in
# the platform refers to this one store by name; none of them talks to AWS
# directly.
#
# Values from docs/technical-spec.md → "Secrets Management" →
# "ClusterSecretStore Configuration": provider aws, service SecretsManager,
# region eu-central-1, JWT auth against external-secrets-sa.
#
# ---------------------------------------------------------------------------
# apiVersion is external-secrets.io/v1, not the v1beta1 the spec shows
#
# This is a deliberate deviation, and it is not cosmetic. In the operator
# version this platform installs (v2.12.0, pinned in scripts/install-eso.sh) the
# ClusterSecretStore CRD serves only v1:
#
#     versions:
#       - name: v1        served: true   storage: true
#       - name: v1beta1   served: false  storage: false
#
# v1beta1 is still present in the CRD as a conversion target, so the schema
# exists and a manifest written against it looks plausible — but the API server
# does not serve it, and the admission webhook is registered for apiVersions
# ["v1"] only. A manifest written against v1beta1 fails the way any unknown
# group version does, with the kind simply not appearing in discovery:
#
#     error: resource mapping not found for name: "aws-secrets-manager"
#     namespace: "" from "clustersecretstore.yaml": no matches for kind
#     "ClusterSecretStore" in version "external-secrets.io/v1beta1"
#     ensure CRDs are installed first
#
# The trailing hint is misleading here — the CRDs are installed, that version
# just is not served — so the message sends you looking in the wrong place.
#
# The spec's configuration is otherwise exactly what is below — provider,
# service, region and the JWT serviceAccountRef all survive the version change
# unchanged. Only the group version moved. If the spec is updated, v1 is the
# value to use.
#
# ---------------------------------------------------------------------------
# ClusterSecretStore rather than SecretStore
#
# A SecretStore is namespaced and would need one copy per environment. A
# ClusterSecretStore is cluster-scoped and both petclinic-dev and petclinic-prod
# refer to this single object, which is why its manifests carry no namespace —
# and why the "all resources MUST specify their namespace" rule in
# .claude/rules/kubernetes.md does not apply to this file. Setting
# metadata.namespace on a cluster-scoped resource is ignored at best.
#
# The store is cluster-scoped but the credentials behind it are not shared: the
# ExternalSecret that reads petclinic/prod/... lives in petclinic-prod and the
# dev one in petclinic-dev. What is shared is the AWS connection, not the
# secrets.
#
# ---------------------------------------------------------------------------
# The store is only as strong as its ServiceAccount
#
# No AWS credentials appear in this file, by design. auth.jwt tells ESO to mint
# a token for external-secrets-sa (serviceaccount.yaml) and exchange it for
# temporary credentials via this cluster's OIDC provider. What the store can
# read is therefore exactly what petclinic-{env}-eso-role permits:
# secret:petclinic/{env}/* in eu-central-1, scoped to this environment so the
# dev role cannot read prod's credentials. Nothing here can widen that — a
# remoteRef pointing at a secret outside that prefix fails with AccessDenied
# from Secrets Manager, not from ESO.
#
# See docs/technical-spec.md → "IRSA Roles".
#
# ---------------------------------------------------------------------------
# spec.conditions limits which namespaces may use this store
#
# Without it a ClusterSecretStore is usable from every namespace in the
# cluster, and the credentials behind it are the RDS master password and the
# OpenAI key. Anyone able to create an ExternalSecret anywhere — a compromised
# workload, a namespace someone else administers — could point one at
# petclinic/{env}/rds-credentials and read the database password out of the
# Secret it produces. The IAM policy cannot prevent that on its own: it scopes
# what the role may read, not who may ask.
#
# namespaceRegexes rather than namespaceSelector: matching on the name is exact
# and needs no label to exist, so this condition does not depend on
# k8s/base/namespaces.yaml (PETPLAT-38) having been applied — and it keeps
# working on a namespace created by hand. A selector would match nothing on an
# unlabelled namespace, which fails closed in a way that is hard to diagnose
# (the ExternalSecret sits in SecretSynced=False with a store-not-found error).
# The regexes match the two namespaces in CLAUDE.md's naming convention,
# petclinic-dev and petclinic-prod, and nothing else.
# ---------------------------------------------------------------------------

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: aws-secrets-manager

  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure

spec:
  conditions:
    - namespaceRegexes:
        - "^petclinic-dev$"
        - "^petclinic-prod$"

  provider:
    aws:
      service: SecretsManager
      region: eu-central-1

      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
