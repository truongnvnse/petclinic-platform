# serviceaccount.yaml — the identity the ClusterSecretStore authenticates as (PETPLAT-34)
#
# ---------------------------------------------------------------------------
# This ServiceAccount does not run any pod
#
# That is the point of it. ESO's AWS JWT auth works by asking the Kubernetes API
# for a token belonging to a service account, then trading that token for
# temporary AWS credentials through this cluster's OIDC provider. The account
# named in auth.jwt.serviceAccountRef is the identity on that token — it does
# not have to be the account the controller pod runs as, and here it is not.
#
# The controller pod runs as the bundle's own `external-secrets` account. This
# account exists only to be referenced, which is why it carries an IRSA
# annotation and no workload. The effect is that compromising the controller pod
# does not by itself hand over this account's token: the pod would have to ask
# the API for one, which the token-creation permission in the controller's
# ClusterRole happens to allow — so treat this as separation of concerns rather
# than a hard boundary.
#
# The IAM side of the pair is terraform/modules/eks/main.tf → aws_iam_role.eso.
# Its trust policy names this exact namespace and name:
#
#     system:serviceaccount:external-secrets:external-secrets-sa
#
# Renaming this account without changing that trust policy produces a token
# exchange that STS refuses with AccessDenied — and the error surfaces on the
# ClusterSecretStore's status, not here, which is the expensive way to find out.
# ---------------------------------------------------------------------------
# One value must be substituted before applying
#
# ESO_ROLE_ARN — the IRSA role Terraform created:
#
#     cd terraform/environments/dev
#     terraform output -raw eso_role_arn
#
# scripts/install-eso.sh does this substitution itself: it renders this file
# with the ARN it resolved and applies the result, so the placeholder never
# reaches the cluster when the script is used. It is left in the file because
# the file is also the documentation of what the annotation has to contain.
#
# Applying this file by hand without substituting it does NOT fail. The
# placeholder is accepted, and the ServiceAccount is created carrying a role ARN
# that is not an ARN. This was verified against the dev cluster rather than
# assumed: the pod-identity webhook (iam-for-pods.amazonaws.com) is a *mutating*
# webhook registered for Pod CREATE only — it has no rule for ServiceAccounts
# and would not run here even if it did. Nothing validates the annotation.
#
# The failure therefore arrives later and somewhere else: the store cannot
# exchange a token for the role, so the ClusterSecretStore reports Ready=False,
# and every ExternalSecret behind it stays unsynced. This is the same silent
# placeholder trap as k8s/base/ingress/ingress.yaml, and it is worth knowing
# about before spending time on the manifests when the annotation is the problem.
#
# Check the applied value with:
#
#   kubectl -n external-secrets get serviceaccount external-secrets-sa \
#     -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}'
# ---------------------------------------------------------------------------

apiVersion: v1
kind: ServiceAccount

metadata:
  name: external-secrets-sa
  namespace: external-secrets

  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure

  annotations:
    # Grants the account the petclinic-{env}-eso-role, whose policy allows
    # secretsmanager:GetSecretValue and DescribeSecret on
    # secret:petclinic/{env}/* — this environment's prefix only.
    eks.amazonaws.com/role-arn: "<ESO_ROLE_ARN>"
