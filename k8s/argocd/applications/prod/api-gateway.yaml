# k8s/argocd/applications/prod/api-gateway.yaml — PETPLAT-114
#
# ArgoCD Application for api-gateway in prod. There is deliberately NO
# `syncPolicy.automated` block: this Application reports OutOfSync and waits for
# a human to run `argocd app sync api-gateway-prod` or click Sync in the UI. The
# omission is the policy — adding an empty `automated: {}` would turn auto-sync
# on, which is the opposite of what prod is meant to do.
#
# valueFiles resolve against `path` (the chart directory) — not against this
# file, and not against the repo root. helm/petclinic-service +
# ../../helm-values/... is helm-values/... at the root: the same two files, in
# the same order, that the runbook passes to `helm upgrade --install`.
#
# releaseName keeps the Helm release called `api-gateway`, not
# `api-gateway-prod`. The chart names every object after the release
# (templates/_helpers.tpl → petclinic-service.fullname), and those names are a
# contract: the Ingress sends ALB traffic to `api-gateway:8080`, so a release
# named `api-gateway-prod` would produce a Service the ALB backend cannot find —
# which surfaces as a 503, not as a sync error.
#
# Prod is NOT deployable as it stands, and a sync will fail rather than surprise
# you — helm-values/prod.yaml still carries the placeholder RDS endpoint
# `REPLACE-ME-prod-rds-endpoint`, and the `petclinic-prod` ECR repositories have
# no images in them. Both are prerequisites this Application cannot satisfy on
# its own. Create the Application now so the set is complete and the dev work
# has something to mirror; expect OutOfSync, not Synced.
#
# Note there is no prod Ingress yet either: k8s/base/ingress/ingress.yaml.tpl
# renders one ALB for whichever environment ran scripts/render-ingress.sh, and
# only dev has been rendered. A prod sync would deploy a gateway nothing routes
# to.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/component: gitops
    app.kubernetes.io/managed-by: kubectl
spec:
  project: default
  source:
    repoURL: https://github.com/truongnvnse/petclinic-platform.git
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: api-gateway
      valueFiles:
        - ../../helm-values/api-gateway.yaml
        - ../../helm-values/prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
