# k8s/argocd/applications/dev/admin-server.yaml — PETPLAT-113
#
# ArgoCD Application for admin-server in dev. Dev is auto-sync: a commit that
# changes either values file below is deployed with no human in the loop.
#
# valueFiles resolve against `path` (the chart directory) — not against this
# file, and not against the repo root. helm/petclinic-service +
# ../../helm-values/... is helm-values/... at the root: the same two files, in
# the same order, that the runbook passes to `helm upgrade --install`.
#
# releaseName keeps the Helm release called `admin-server`, not
# `admin-server-dev`. The chart names every object after the release
# (templates/_helpers.tpl → petclinic-service.fullname), and those names are a
# contract. helm-values/admin-server.yaml sets fullnameOverride as well, so the
# object names hold either way — this line keeps the release record consistent
# with the installs already in the cluster.
#
# admin-server is the Spring Boot Admin dashboard. It is not in the request path
# for anything else, so it is the one service whose failure does not take
# another service down with it — which makes it the cheapest place to test a
# sync, and the reason PETPLAT-116's GitOps loop test should start here.
#
# The image tag lives in helm-values/admin-server.yaml, not here, and CI rewrites
# it on every build. An Application can read Synced and Healthy while the pod
# sits in ImagePullBackOff if that tag is missing from ECR.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-server-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: admin-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/component: gitops
    app.kubernetes.io/managed-by: kubectl
spec:
  project: default
  source:
    repoURL: https://github.com/truongnvnse/petclinic-platform.git
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: admin-server
      valueFiles:
        - ../../helm-values/admin-server.yaml
        - ../../helm-values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
